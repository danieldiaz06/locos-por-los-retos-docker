services:
  # Servicio web1
  web1:
    build:
      context: ./httpd
      dockerfile: Dockerfile-web1   # Apache + PHP
    image: daiaz/web1:latest        # Imagen en Docker Hub
    container_name: web1
    networks:
      mynetwork:
        ipv4_address: 172.25.0.2
    ports:
      - "8080:80"    # web1 accesible en http://localhost:8080

  # Servicio web2
  web2:
    build:
      context: ./httpd
      dockerfile: Dockerfile-httpd
    image: daiaz/web2:latest
    container_name: web2
    networks:
      mynetwork:
        ipv4_address: 172.25.0.3
    ports:
      - "8082:80"    # web2 accesible en http://localhost:8082 (8081 ya lo usa otra práctica)

  # Servicio de firewall
  firewall:
    build:
      context: ./firewall
      dockerfile: Dockerfile-firewall
    image: daiaz/firewall:latest
    container_name: firewall
    cap_add:
      - NET_ADMIN        # Privilegios para manipular la red (iptables)
    networks:
      mynetwork:
        ipv4_address: 172.25.0.4

  # Nuevo contenedor Parrot Security OS (máquina administradora)
  parrot:
    build:
      context: ./parrotsec
      dockerfile: Dockerfile-parrot
    image: daiaz/parrotsec:latest
    container_name: parrot
    cap_add:
      - SYS_ADMIN        # Privilegios elevados
      - NET_ADMIN        # Gestionar la red
      - NET_RAW          # Paquetes en crudo (nmap -O / -sS, tshark)
    stdin_open: true     # Mantiene la terminal abierta
    tty: true            # Terminal interactivo
    networks:
      mynetwork:
        ipv4_address: 172.25.0.5

# Definición de la red "mynetwork"
networks:
  mynetwork:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
